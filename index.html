<!-- INICIO DEL WIDGET FINLAY RADIO (DISEÑO OSCURO COMPACTO) -->
<div class="finlay-radio-widget">
  <h2 class="radio-title">FinLay Radio</h2>
  
  <!-- 1. IMAGEN DE LA RADIO -->
  <div class="radio-image-container">
    <!-- NOTA: Si la imagen no se muestra, abre tu enlace de Imgur, haz clic derecho sobre la imagen y selecciona "Copiar dirección de la imagen". Luego reemplaza la URL de abajo. -->
    <img src="https://i.imgur.com/UiQg8Vq.jpeg" alt="FinLay Radio" class="radio-image" onerror="this.src='https://via.placeholder.com/300x200/1a1a2e/ffd700?text=FinLay+Radio+Img'">
  </div>

  <!-- 2. REPRODUCTOR DE RADIO (COMPACTO) -->
  <div class="audio-player-container">
    <div class="live-indicator">
      <span class="pulse"></span> EN VIVO
    </div>
    <audio controls class="radio-player" src="https://stream.zeno.fm/pb7ywd9xcp4uv" preload="none">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

  <!-- 3. FILA INFERIOR: RELOJ DIGITAL Y TEMPERATURA -->
  <div class="info-row">
    <!-- Reloj Digital -->
    <div class="info-box clock-box">
      <div class="info-label">HORA LOCAL</div>
      <div class="digital-clock" id="digital-clock">00:00:00</div>
    </div>
    
    <!-- Temperatura Buenos Aires -->
    <div class="info-box weather-box">
      <div class="info-label">BUENOS AIRES</div>
      <div class="temperature" id="temperature">
        <span class="loading-temp">Cargando...</span>
      </div>
    </div>
  </div>
</div>

<style>
  /* --- Estilos Generales del Widget --- */
  .finlay-radio-widget {
    max-width: 330px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 38px; /* Ligeramente más compacto en general */
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border-radius: 20px;
    border: 1px solid #2a2a4a;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 240, 255, 0.05);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    box-sizing: border-box;
    color-scheme: dark;
  }

  .radio-title {
    margin: 0 0 15px 0;
    font-size: 1.5rem;
    color: #ffffff;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  /* --- 1. Estilos de la Imagen --- */
  .radio-image-container {
    width: 100%;
    margin-bottom: 18px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid #ffd700;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.25);
    background: #000;
  }

  .radio-image {
    width: 100%;
    height: auto;
    display: block;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  
  .radio-image:hover {
    transform: scale(1.02);
  }

  /* --- 2. Estilos del Reproductor (COMPACTO) --- */
  .audio-player-container {
    width: 100%;
    background: #0f0f1a;
    padding: 10px 12px; /* Padding reducido para hacerlo más chico */
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    border: 1px solid #2a2a4a;
  }

  .live-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px; /* Margen reducido */
    font-size: 0.75rem; /* Texto ligeramente más pequeño */
    font-weight: 800;
    color: #ff3366;
    letter-spacing: 1.5px;
    text-shadow: 0 0 8px rgba(255, 51, 102, 0.6);
  }

  .pulse {
    width: 8px; /* Punto más pequeño */
    height: 8px;
    background: #ff3366;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7);
    animation: pulse-animation 1.5s infinite;
  }

  @keyframes pulse-animation {
    0% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0.7); }
    70% { box-shadow: 0 0 0 8px rgba(255, 51, 102, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 51, 102, 0); }
  }

  .radio-player {
    width: 100%;
    height: 32px; /* Altura reducida de 40px a 32px */
    border-radius: 16px;
    outline: none;
    /* Filtro para asegurar que el reproductor nativo se vea oscuro en todos los navegadores */
    filter: invert(0.9) hue-rotate(180deg); 
  }

  /* --- 3. Estilos de la Fila Inferior (Reloj y Clima) --- */
  .info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
  }

  .info-box {
    flex: 1;
    background: #0a0a12;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 10px 8px; /* Padding ligeramente ajustado */
    text-align: center;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    transition: border-color 0.3s ease;
  }

  .info-box:hover {
    border-color: #00f0ff;
  }

  .info-label {
    font-size: 0.65rem;
    color: #8892b0;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 5px;
    font-weight: 600;
  }

  .digital-clock {
    font-family: 'Courier New', Courier, monospace;
    font-size: 1.25rem; /* Ligeramente más pequeño para equilibrar */
    font-weight: bold;
    color: #00f0ff; /* Cian Neón */
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
    letter-spacing: 2px;
  }

  .temperature {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    color: #ffd700; /* Dorado Neón */
    text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
  }

  /* --- Responsive para móviles muy pequeños --- */
  @media (max-width: 360px) {
    .finlay-radio-widget { padding: 15px 10px; }
    .radio-title { font-size: 1.3rem; }
    .digital-clock { font-size: 1.1rem; }
    .temperature { font-size: 1.15rem; }
    .info-label { font-size: 0.6rem; }
    .radio-player { height: 30px; } /* Aún más compacto en móviles diminutos */
  }
</style>

<script>
  (function() {
    /* --- 1. Lógica del Reloj Digital --- */
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const digitalClock = document.getElementById('digital-clock');
      if (digitalClock) {
        digitalClock.textContent = `${h}:${m}:${s}`;
      }
    }
    setInterval(updateClock, 1000);
    updateClock(); // Ejecutar inmediatamente al cargar

    /* --- 2. Lógica de la Temperatura (API Open-Meteo Gratuita) --- */
    async function fetchBuenosAiresWeather() {
      const tempElement = document.getElementById('temperature');
      if (!tempElement) return;

      try {
        // Coordenadas de Buenos Aires: Lat -34.6037, Lon -58.3816
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-34.6037&longitude=-58.3816&current_weather=true');
        const data = await response.json();
        
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;
        
        // Icono según el código del clima
        let icon = '🌡️';
        if (code === 0) icon = '☀️';
        else if (code >= 1 && code <= 3) icon = '⛅';
        else if (code >= 45 && code <= 48) icon = '🌫️';
        else if (code >= 51 && code <= 67) icon = '🌧️';
        else if (code >= 71 && code <= 77) icon = '❄️';
        else if (code >= 95) icon = '⛈️';

        tempElement.innerHTML = `${temp}°C <span style="font-size:1.2rem; vertical-align: middle;">${icon}</span>`;
      } catch (error) {
        console.error("Error al obtener el clima:", error);
        tempElement.innerHTML = `--°C <span style="font-size:1.2rem;">⚠️</span>`;
      }
    }

    // Cargar al inicio y actualizar cada 10 minutos (600000 ms)
    fetchBuenosAiresWeather();
    setInterval(fetchBuenosAiresWeather, 600000);
  })();
</script>
<!-- FIN DEL WIDGET FINLAY RADIO -->
