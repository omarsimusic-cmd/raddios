<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Radios de Omarsi</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #eef2f7 0%, #f7f8fb 40%, #ffffff 100%);
      color: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 40px;
    }

    .page-header {
      width: 100%;
      max-width: 420px;
      text-align: center;
      margin-bottom: 18px;
    }
    .brand-logo {
      width: min(50px, 40vw);
      height: auto;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 8px 22px rgba(0,0,0,0.18);
      margin-bottom: 14px;
    }
    .page-title {
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 800;
      line-height: 1.2;
      color: #111;
      letter-spacing: -0.3px;
    }
    .page-subtitle {
      margin-top: 6px;
      font-size: 13px;
      color: #667085;
      font-weight: 500;
    }

    .player-shell {
      width: 100%;
      max-width: 420px;
      background: #0f1115;
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 22px 50px rgba(15, 17, 21, 0.35);
      color: #fff;
    }

    .now-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .cover {
      width: 68px;
      height: 68px;
      border-radius: 14px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    }
    .meta { flex: 1; min-width: 0; }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1db954;
      color: #04140a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 6px;
    }
    .live-badge::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: #04140a;
      animation: blink 1.2s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .station-name {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-line {
      margin-top: 3px;
      font-size: 12px;
      color: #a7aeb8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .track-line span { color: #1db954; }
    .artist-line {
      margin-top: 2px;
      font-size: 11px;
      color: #8b949e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 14px;
    }

    .play-btn {
      width: 54px; height: 54px; border-radius: 50%; border: none;
      background: #fff; color: #0f1115; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }
    .play-btn:active { transform: scale(0.94); }
    .play-btn svg { width: 24px; height: 24px; fill: currentColor; }

    .transport {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 10px 12px;
    }
    .timer {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #c9d0d8;
      min-width: 54px;
    }
    .volume-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .volume-wrap svg { width: 16px; height: 16px; fill: #9aa3ad; flex-shrink: 0; }
    .volume {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 999px;
      background: #3a414b; outline: none;
    }
    .volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #fff; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    }
    .volume::-moz-range-thumb {
      width: 14px; height: 14px; border: none; border-radius: 50%;
      background: #fff; cursor: pointer;
    }

    .viz-wrap {
      margin-top: 12px; height: 44px; border-radius: 10px;
      overflow: hidden; background: rgba(255,255,255,0.04);
    }
    .viz-wrap canvas { width: 100%; height: 100%; display: block; }

    .stations-label {
      margin: 16px 2px 8px;
      font-size: 11px; font-weight: 700; letter-spacing: 0.8px;
      text-transform: uppercase; color: #8b949e;
    }
    .stations {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .station {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 8px 6px 7px;
      cursor: pointer;
      text-align: center;
      color: #fff;
    }
    .station:hover { background: rgba(255,255,255,0.08); }
    .station.active {
      border-color: #1db954;
      background: rgba(29, 185, 84, 0.12);
      box-shadow: 0 0 0 1px rgba(29,185,84,0.25);
    }
    .station img {
      width: 42px; height: 42px; border-radius: 10px;
      object-fit: cover; display: block; margin: 0 auto 6px; background: #222;
    }
    .station span {
      display: block; font-size: 10px; font-weight: 600; line-height: 1.2;
      color: #cfd5dc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .station.active span { color: #1db954; }

    .actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      border-radius: 10px;
      padding: 9px 8px;
      font-size: 11px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      line-height: 1;
    }
    .action-app { background: #fff; color: #0f1115; }
    .action-wa { background: #25D366; color: #053b1d; }
    .action-spotify {
      background: #1db954;
      color: #04140a;
    }
    .action-youtube {
      background: #ff0000;
      color: #fff;
    }
    .action.is-disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .action svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

    .footer-note {
      margin-top: 14px;
      text-align: center;
      font-size: 11px;
      color: #667085;
      max-width: 420px;
      line-height: 1.45;
    }

    @media (min-width: 768px) {
      body { padding: 28px 20px 50px; }
      .page-header, .player-shell, .footer-note { max-width: 480px; }
      .stations { gap: 10px; }
      .station img { width: 48px; height: 48px; }
    }
    @media (min-width: 1024px) {
      body {
        min-height: 100vh;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(29,185,84,0.08), transparent 35%),
          radial-gradient(circle at 80% 10%, rgba(37,211,102,0.06), transparent 30%),
          linear-gradient(180deg, #eef2f7 0%, #f8fafc 100%);
      }
      .player-shell { max-width: 520px; padding: 18px; }
      .stations { grid-template-columns: repeat(7, 1fr); }
      .station span { font-size: 9px; }
    }
  </style>
</head>

<script>
(function () {
  "use strict";

  /**
   * Spotify Web API (Client Credentials)
   * Creá una app en https://developer.spotify.com/dashboard
   * y pegá aquí Client ID y Client Secret.
   * Nota: en producción es mejor obtener el token desde un backend.
   */
  var SPOTIFY_CLIENT_ID = "";
  var SPOTIFY_CLIENT_SECRET = "";

  var radios = [
    { name: "FinLay Radio", short: "FinLay", stream: "https://stream.zeno.fm/pb7ywd9xcp4uv", logo: "https://imgfz.com/i/7Xf0Vtv.jpeg" },
    { name: "Viejas Románticas", short: "Viejas", stream: "https://stream.zeno.fm/urmfkad2em0uv", logo: "https://imgfz.com/i/Em08gOQ.png" },
    { name: "Cumbias y Rock", short: "Cumbias", stream: "https://stream.zeno.fm/jkodkmize49vv", logo: "https://imgfz.com/i/wNuO86C.jpeg" },
    { name: "Joven Latina", short: "Joven", stream: "https://stream.zeno.fm/vw2af2mht68uv", logo: "https://imgfz.com/i/sUR9uEH.jpeg" },
    { name: "Radio Henry Web", short: "Henry", stream: "https://stream.zeno.fm/73bvgeu2f78uv", logo: "https://imgfz.com/i/umKbrAt.jpeg" },
    { name: "Cumbias a Pleno", short: "Pleno", stream: "https://stream.zeno.fm/1n6w364parzuv", logo: "https://imgfz.com/i/LJmKqGB.jpeg" },
    { name: "Cristiana FCW", short: "FCW", stream: "https://stream.zeno.fm/4vuaijuxegzvv", logo: "https://imgfz.com/i/47Hpkwx.jpeg" }
  ];

  var audio = document.getElementById("audio");
  var playBtn = document.getElementById("playBtn");
  var iconPlay = document.getElementById("iconPlay");
  var iconPause = document.getElementById("iconPause");
  var cover = document.getElementById("cover");
  var stationName = document.getElementById("stationName");
  var trackTitle = document.getElementById("trackTitle");
  var artistLine = document.getElementById("artistLine");
  var timerEl = document.getElementById("timer");
  var volume = document.getElementById("volume");
  var stationsEl = document.getElementById("stations");
  var spotifyBtn = document.getElementById("spotifyBtn");
  var youtubeBtn = document.getElementById("youtubeBtn");
  var canvas = document.getElementById("viz");
  var ctx = canvas.getContext("2d");

  var current = 0;
  var playing = false;
  var sec = 0;
  var intentionalPause = true;
  var reconnectTimer = null;
  var waitingTimer = null;
  var reconnectAttempts = 0;
  var MAX_RECONNECT = 8;
  var lastTrack = "";
  var audioCtx = null;
  var analyser = null;
  var sourceNode = null;
  var vizData = null;
  var rafId = null;
  var metaPoll = null;
  var metaSse = null;
  var coverRequest = 0;
  var spotifyToken = null;
  var spotifyTokenExp = 0;

  function fmt(n) { return n < 10 ? "0" + n : String(n); }
  function fmtTime(s) {
    return fmt(Math.floor(s / 3600)) + ":" + fmt(Math.floor((s % 3600) / 60)) + ":" + fmt(s % 60);
  }

  function bufferAhead() {
    try {
      if (!audio.buffered || !audio.buffered.length) return 0;
      var t = audio.currentTime || 0;
      for (var i = 0; i < audio.buffered.length; i++) {
        if (t >= audio.buffered.start(i) && t <= audio.buffered.end(i)) {
          return audio.buffered.end(i) - t;
        }
      }
      return Math.max(0, audio.buffered.end(audio.buffered.length - 1) - t);
    } catch (e) { return 0; }
  }

  function streamUrl(forceNew) {
    var base = radios[current].stream;
    if (!forceNew) return base;
    return base + (base.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
  }

  function loadStream(forceNew) {
    clearTimeout(waitingTimer);
    audio.src = streamUrl(!!forceNew);
    try { audio.load(); } catch (e) {}
  }

  function clearReconnect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  }

  function scheduleReconnect() {
    if (!playing || intentionalPause || reconnectAttempts >= MAX_RECONNECT) return;
    if (bufferAhead() > 2.5) return;
    clearReconnect();
    var delay = Math.min(1200 + reconnectAttempts * 1400, 9000);
    reconnectTimer = setTimeout(function () {
      if (!playing || intentionalPause) return;
      reconnectAttempts++;
      loadStream(true);
      tryPlay();
    }, delay);
  }

  function tryPlay() {
    if (!playing || intentionalPause) return;
    var p = audio.play();
    if (p !== undefined) {
      p.then(function () { reconnectAttempts = 0; })
       .catch(function () { scheduleReconnect(); });
    }
  }

  function setPlayingUI(isOn) {
    iconPlay.style.display = isOn ? "none" : "block";
    iconPause.style.display = isOn ? "block" : "none";
  }

  function setupAnalyser() {
    if (analyser) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.8;
      sourceNode = audioCtx.createMediaElementSource(audio);
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      vizData = new Uint8Array(analyser.frequencyBinCount);
    } catch (e) { analyser = null; }
  }

  function drawViz() {
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    if (!analyser || !playing) {
      ctx.strokeStyle = "rgba(29,185,84,0.28)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var x = 0; x < w; x++) {
        var y = h / 2 + Math.sin(x * 0.035 + Date.now() * 0.002) * 3.5;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
      if (!playing) rafId = requestAnimationFrame(drawViz);
      return;
    }
    analyser.getByteFrequencyData(vizData);
    var bars = 42, gap = 2, barW = (w - gap * (bars - 1)) / bars;
    var step = Math.floor(vizData.length / bars);
    var sum = 0;
    for (var s = 0; s < vizData.length; s++) sum += vizData[s];
    var useFake = sum < 10;
    var t = Date.now() * 0.004;
    for (var i = 0; i < bars; i++) {
      var v = useFake
        ? 0.2 + 0.4 * Math.abs(Math.sin(t + i * 0.33)) + 0.15 * Math.abs(Math.sin(t * 1.5 + i * 0.12))
        : vizData[i * step] / 255;
      var barH = Math.max(2, v * h * 0.92);
      var x = i * (barW + gap);
      var y = (h - barH) / 2;
      var g = ctx.createLinearGradient(0, y, 0, y + barH);
      g.addColorStop(0, "#1ed760");
      g.addColorStop(1, "#1db954");
      ctx.fillStyle = g;
      ctx.fillRect(x, y, barW, barH);
    }
    rafId = requestAnimationFrame(drawViz);
  }

  function startViz() {
    setupAnalyser();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(function () {});
    if (rafId) cancelAnimationFrame(rafId);
    drawViz();
  }

  function stopViz() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "rgba(29,185,84,0.2)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height / 2);
    ctx.lineTo(canvas.width, canvas.height / 2);
    ctx.stroke();
  }

  function stopMeta() {
    if (metaSse) { try { metaSse.close(); } catch (e) {} metaSse = null; }
    if (metaPoll) { clearInterval(metaPoll); metaPoll = null; }
  }

  function setMusicLinks(spotifyUrl, query) {
    if (spotifyBtn) {
      if (spotifyUrl) {
        spotifyBtn.href = spotifyUrl;
        spotifyBtn.classList.remove("is-disabled");
      } else if (query) {
        spotifyBtn.href = "https://open.spotify.com/search/" + encodeURIComponent(query);
        spotifyBtn.classList.remove("is-disabled");
      } else {
        spotifyBtn.href = "#";
        spotifyBtn.classList.add("is-disabled");
      }
    }
    if (youtubeBtn) {
      if (query) {
        youtubeBtn.href = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
        youtubeBtn.classList.remove("is-disabled");
      } else {
        youtubeBtn.href = "#";
        youtubeBtn.classList.add("is-disabled");
      }
    }
  }

  function setCoverSafe(url, fallback) {
    var req = ++coverRequest;
    var img = new Image();
    img.onload = function () { if (req === coverRequest) cover.src = url; };
    img.onerror = function () { if (req === coverRequest) cover.src = fallback || radios[current].logo; };
    img.src = url;
  }

  function parseMeta(raw) {
    raw = (raw || "").trim();
    if (!raw) return null;
    var parts = raw.split(/\s[-–—]\s/);
    if (parts.length >= 2) {
      return { artist: parts[0].trim(), title: parts.slice(1).join(" - ").trim(), raw: raw };
    }
    return { artist: radios[current].name, title: raw, raw: raw };
  }

  // ---- Spotify API ----
  function getSpotifyToken() {
    return new Promise(function (resolve) {
      if (!SPOTIFY_CLIENT_ID || !SPOTIFY_CLIENT_SECRET) {
        resolve(null);
        return;
      }
      var now = Date.now();
      if (spotifyToken && now < spotifyTokenExp - 30000) {
        resolve(spotifyToken);
        return;
      }
      var body = "grant_type=client_credentials";
      var basic = btoa(SPOTIFY_CLIENT_ID + ":" + SPOTIFY_CLIENT_SECRET);
      fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "Authorization": "Basic " + basic
        },
        body: body
      }).then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.access_token) {
            spotifyToken = d.access_token;
            spotifyTokenExp = Date.now() + (d.expires_in || 3600) * 1000;
            resolve(spotifyToken);
          } else resolve(null);
        })
        .catch(function () { resolve(null); });
    });
  }

  function searchSpotify(artist, title) {
    var q = (artist + " " + title).replace(/[\(\[].*?[\)\]]/g, " ").replace(/\s+/g, " ").trim();
    if (!q) return Promise.resolve(null);

    return getSpotifyToken().then(function (token) {
      if (!token) return null;
      var url = "https://api.spotify.com/v1/search?type=track&limit=1&q=" + encodeURIComponent(q);
      return fetch(url, { headers: { Authorization: "Bearer " + token } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var item = d && d.tracks && d.tracks.items && d.tracks.items[0];
          if (!item) return null;
          var art = item.album && item.album.images && item.album.images[0] && item.album.images[0].url;
          return {
            artwork: art || null,
            url: item.external_urls && item.external_urls.spotify,
            name: item.name,
            artist: item.artists && item.artists[0] && item.artists[0].name
          };
        })
        .catch(function () { return null; });
    });
  }

  function searchItunes(artist, title) {
    var q = (artist + " " + title).replace(/[\(\[].*?[\)\]]/g, " ").replace(/\s+/g, " ").trim();
    return new Promise(function (resolve) {
      if (!q) { resolve(null); return; }
      $.ajax({
        url: "https://itunes.apple.com/search",
        data: { term: q, media: "music", limit: 1 },
        dataType: "jsonp",
        timeout: 6000,
        success: function (res) {
          if (res && res.results && res.results.length && res.results[0].artworkUrl100) {
            resolve(res.results[0].artworkUrl100.replace("100x100bb", "600x600bb"));
          } else resolve(null);
        },
        error: function () { resolve(null); }
      });
    });
  }

  function enrichTrack(artist, title) {
    var fallback = radios[current].logo;
    var query = (artist + " " + title).trim();
    setMusicLinks(null, query);

    searchSpotify(artist, title).then(function (sp) {
      if (sp) {
        if (sp.artwork) setCoverSafe(sp.artwork, fallback);
        if (sp.url) setMusicLinks(sp.url, query);
        else setMusicLinks(null, query);
        if (!sp.artwork) {
          searchItunes(artist, title).then(function (art) {
            if (art) setCoverSafe(art, fallback);
            else setCoverSafe(fallback);
          });
        }
      } else {
        setMusicLinks(null, query);
        searchItunes(artist, title).then(function (art) {
          if (art) setCoverSafe(art, fallback);
          else setCoverSafe(fallback);
        });
      }
    });
  }

  function handleTitle(full, extra) {
    var meta = parseMeta(full);
    if (!meta) return;
    if (meta.raw === lastTrack) return;
    lastTrack = meta.raw;

    var directArt = extra && (extra.cover || extra.image || extra.img || extra.artwork || extra.cover_url || extra.art);
    var artist = meta.artist && meta.artist !== meta.title ? meta.artist : radios[current].name;

    trackTitle.textContent = meta.title || meta.raw;
    if (artistLine) artistLine.textContent = artist;

    if (directArt) {
      setCoverSafe(directArt, radios[current].logo);
      setMusicLinks(null, artist + " " + (meta.title || ""));
    }
    enrichTrack(meta.artist, meta.title);
  }

  function startMeta() {
    stopMeta();
    lastTrack = "";
    trackTitle.textContent = "Conectando metadatos...";
    if (artistLine) artistLine.textContent = radios[current].name;
    cover.src = radios[current].logo;
    setMusicLinks(null, null);

    var stream = radios[current].stream;
    var mount = stream.split("/").pop().split("?")[0];
    var sseOk = false;
    var pollStarted = false;

    function startPolling() {
      if (pollStarted) return;
      pollStarted = true;
      function poll() {
        $.getJSON("https://twj.es/get_stream_title/?url=" + encodeURIComponent(stream))
          .done(function (d) {
            var title = d.title || d.streamTitle || d.stream_title || d.StreamTitle || d.song || "";
            if (title) handleTitle(title, d);
          })
          .fail(function () {});
      }
      poll();
      metaPoll = setInterval(poll, 12000);
    }

    if (window.EventSource) {
      try {
        metaSse = new EventSource("https://api.zeno.fm/mounts/metadata/subscribe/" + mount);
        metaSse.onmessage = function (ev) {
          try {
            var d = JSON.parse(ev.data);
            var title = d.streamTitle || d.title || d.song || "";
            if (title) { sseOk = true; handleTitle(title, d); }
          } catch (e) {}
        };
        metaSse.onerror = function () { if (!pollStarted) startPolling(); };
      } catch (e) { startPolling(); }
    } else {
      startPolling();
    }

    setTimeout(function () { if (!sseOk) startPolling(); }, 5000);
  }

  function selectStation(index, autoPlay) {
    if (index < 0 || index >= radios.length) return;
    var wasPlaying = playing || !!autoPlay;
    current = index;
    var r = radios[current];
    cover.src = r.logo;
    stationName.textContent = r.name;
    document.querySelectorAll(".station").forEach(function (el, i) {
      el.classList.toggle("active", i === current);
    });
    sec = 0;
    timerEl.textContent = "00:00:00";
    startMeta();

    if (wasPlaying) {
      intentionalPause = false;
      playing = true;
      setPlayingUI(true);
      reconnectAttempts = 0;
      loadStream(true);
      tryPlay();
      startViz();
    } else {
      intentionalPause = true;
      playing = false;
      setPlayingUI(false);
      try { audio.removeAttribute("src"); audio.load(); } catch (e) {}
      stopViz();
    }
  }

  function togglePlay() {
    if (!playing) {
      intentionalPause = false;
      playing = true;
      setPlayingUI(true);
      reconnectAttempts = 0;
      loadStream(true);
      tryPlay();
      startViz();
    } else {
      intentionalPause = true;
      playing = false;
      setPlayingUI(false);
      clearReconnect();
      clearTimeout(waitingTimer);
      audio.pause();
      try { audio.removeAttribute("src"); audio.load(); } catch (e) {}
      stopViz();
    }
  }

  radios.forEach(function (r, i) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "station" + (i === 0 ? " active" : "");
    btn.innerHTML = '<img src="' + r.logo + '" alt=""><span>' + r.short + "</span>";
    btn.title = r.name;
    btn.addEventListener("click", function () { selectStation(i, true); });
    stationsEl.appendChild(btn);
  });

  playBtn.addEventListener("click", togglePlay);
  volume.addEventListener("input", function () { audio.volume = parseFloat(volume.value); });
  audio.volume = 1;

  setInterval(function () {
    if (playing) {
      sec++;
      timerEl.textContent = fmtTime(sec);
    }
  }, 1000);

  audio.addEventListener("error", function () { if (playing) scheduleReconnect(); });
  audio.addEventListener("ended", function () { if (playing) scheduleReconnect(); });
  audio.addEventListener("stalled", function () {
    if (!playing) return;
    clearTimeout(waitingTimer);
    waitingTimer = setTimeout(function () {
      if (playing && bufferAhead() < 0.5) scheduleReconnect();
    }, 7000);
  });
  audio.addEventListener("waiting", function () {
    if (!playing) return;
    clearTimeout(waitingTimer);
    waitingTimer = setTimeout(function () {
      if (playing && bufferAhead() < 1 && audio.readyState < 3) scheduleReconnect();
    }, 14000);
  });
  audio.addEventListener("playing", function () {
    clearTimeout(waitingTimer);
    clearReconnect();
    reconnectAttempts = 0;
  });
  audio.addEventListener("canplay", function () {
    clearTimeout(waitingTimer);
    if (playing) tryPlay();
  });
  audio.addEventListener("progress", function () {
    if (bufferAhead() > 3.5) {
      clearTimeout(waitingTimer);
      clearReconnect();
      reconnectAttempts = 0;
    }
  });

  selectStation(0, false);
  stopViz();
})();
</script>
</body>
</html>
